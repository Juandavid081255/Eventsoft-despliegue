services:
  - type: web
    name: software-eventos
    runtime: python
    pythonVersion: 3.12
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: gunicorn principal_eventos.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12